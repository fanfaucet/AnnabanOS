name: AnnabanOS Internal API Runtime Tests

on:
  push:
    paths:
      - "internal_api/**"
      - "annaban_boundary/**"
      - "tests/**"
      - ".github/workflows/internal-api-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip "fastapi>=0.115,<1.0" "uvicorn[standard]>=0.30,<1.0" "httpx>=0.27,<1.0" "pytest>=8,<9"
      - name: Run API runtime tests
        env:
          ANNABAN_INTERNAL_API_TOKEN: ci-test-token-not-for-production
          ANNABAN_EVENT_DB: ./test-events.sqlite3
        run: pytest -q tests/test_internal_api.py tests/test_annaban_boundary.py
